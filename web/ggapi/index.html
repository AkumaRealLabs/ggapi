<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#faf7f0" />
    <!-- paper-sketch: LXGW WenKai (tech-visual-explainer). Offline falls back to KaiTi. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css"
    />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <!-- data-paper-family: presence marker for paper chrome (empty value, same as
       ThemeCustomizationProvider). Seeded for first paint + root error routes
       that can render before providers re-apply attributes from cookies. -->
  <body
    data-theme-preset="paper-sketch"
    data-theme-font="hand"
    data-paper-family
  >
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
