# ggapi fork: Electron desktop CI is disabled.
# This repository only builds Linux amd64 on the org-linux runner group.
# Upstream still has Windows/macOS Electron packaging; re-enable only if needed.
name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Note only — Electron builds are disabled for ggapi'
        required: false

jobs:
  skipped:
    name: Electron builds disabled (Linux x64 only)
    runs-on:
      group: org-linux
    steps:
      - name: Explain
        run: |
          echo "Electron desktop builds are disabled for ggapi (Linux amd64 only)."
          echo "Use release.yml for Linux binaries, or restore upstream electron-build.yml if needed."
