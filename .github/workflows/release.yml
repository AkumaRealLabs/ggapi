name: Release (Linux amd64 binaries)

# ggapi: optional bare-binary GitHub Release. Default ship path is tag → GHCR
# (docker-build.yml). This workflow does NOT run on tag push — only manual dispatch.
# Requires an existing fork-form tag whose commit is on origin/main history.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing fork tag to build (e.g. v1.0.0-rc.20.1)'
        required: true
        type: string

# Share the per-tag lock with docker-build.yml so Release state cannot change
# between policy detection and the final write.
concurrency:
  group: ggapi-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux amd64 Release
    # ggapi: GitHub-hosted Linux x64 only; no macOS/Windows/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}

      - name: Determine Version
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '\.[1-9][0-9]*$'; then
            echo "::error::Tag must end with fork counter .N (N >= 1)"
            exit 1
          fi
          BASE="${VERSION%.*}"
          if ! printf '%s' "$BASE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Base is not a valid upstream version string"
            exit 1
          fi
          git fetch origin --tags --force 2>/dev/null || true
          if ! git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::Release tag does not exist"
            exit 1
          fi
          git fetch --no-tags https://github.com/QuantumNous/new-api.git \
            "refs/tags/${BASE}:refs/tags/upstream-base/${BASE}" || {
            echo "::error::Base tag is not on QuantumNous/new-api; use <existing-upstream-tag>.N"
            exit 1
          }
          TAG_SHA=$(git rev-parse "refs/tags/${VERSION}^{}")
          BASE_SHA=$(git rev-parse "refs/tags/upstream-base/${BASE}^{}")
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::Checked-out HEAD does not match tag object"
            exit 1
          fi
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$BASE_SHA" "$TAG_SHA"; then
            echo "::error::Base tag is not an ancestor of the release tag commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"; then
            echo "::error::Release tag commit is not an ancestor of origin/main"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building binaries for VERSION=$VERSION"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'

      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api-$VERSION

      - name: Generate checksums
        run: sha256sum new-api-* > checksums-linux.txt

      - name: Determine GitHub Release latest policy
        id: release_policy
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}")
          case "$STATUS" in
            200) echo "make_latest=" >> "$GITHUB_OUTPUT" ;;
            404) echo "make_latest=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unable to determine existing Release state (HTTP ${STATUS})"
              exit 1
              ;;
          esac

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag }}
          # Preserve an existing Release; never promote a newly created historical Release.
          make_latest: ${{ steps.release_policy.outputs.make_latest }}
          files: |
            new-api-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
